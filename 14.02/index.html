<!DOCTYPE html>
<html lang="fr" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGON-NEXUS-ORBIS // FW 14.02</title>
    <link rel="icon" type="image/png" href="../pspulse.png">
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #111827;
            --border: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(30, 41, 59, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.15) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 24px 32px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .badge-left {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 8px 16px;
            border-radius: 6px;
        }

        .badge-right {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 6px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .card {
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 50px;
            width: 600px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .orbis-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border: 2px solid var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
        }

        h2 {
            color: var(--text);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn-primary {
            background: #0284c7;
            border: 1px solid #0369a1;
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            width: 100%;
            margin-bottom: 16px;
        }

        .btn-primary:hover {
            background: #0369a1;
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }

        .nav-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        .btn-secondary {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            flex: 1;
        }

        .btn-secondary:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
            color: var(--text);
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="top-bar">
            <div class="badge-left">DRAGON-NEXUS-ORBIS</div>
            <div class="badge-right">FW 14.02 // SLOPKIT</div>
        </div>

        <div class="main-container">
            <div class="card">
                <div class="orbis-logo">ORBIS</div>
                <h2 id="status-title">Lancement automatique...</h2>
                <p>Connexion à l'environnement d'exploitation (FW 14.02) en cours...</p>
                
                <a href="jb.html" id="launch-btn" class="btn-primary">Lancer l'exploit FW 14.02</a>
                
                <div class="nav-container">
                    <a href="../index.html" class="btn-secondary">← Retour au menu</a>
                    <a href="../tools/index.html" class="btn-secondary" style="border-color: rgba(56, 189, 248, 0.4); color: var(--accent);">🛠️ Outils</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var btn = document.getElementById('launch-btn');
                if (btn) {
                    window.location.href = btn.href;
                }
            }, 1000);
        });
    </script>

</body>
</html>
