<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAGON-NEXUS-ORBIS // FW 13.00 - 13.52</title>
<link rel="icon" type="image/png" href="../pspulse.png">
<style>
    :root {
        --bg: #0b0f19;
        --panel: #111827;
        --border: #1e293b;
        --accent: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.25);
        --text: #f8fafc;
        --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        background-color: var(--bg);
        background-image: 
            linear-gradient(rgba(30, 41, 59, 0.15) 1px, transparent 1px),
            linear-gradient(90deg, rgba(30, 41, 59, 0.15) 1px, transparent 1px);
        background-size: 32px 32px;
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        overflow: hidden;
    }

    .app {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100vh;
        padding: 24px 32px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
    }

    .badge-left {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1.5px;
        padding: 8px 16px;
        border-radius: 6px;
    }

    .badge-right {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 1px;
        padding: 8px 16px;
        border-radius: 6px;
    }

    .main-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
    }

    .card {
        background: rgba(17, 24, 39, 0.75);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 60px;
        width: 650px;
        text-align: center;
        backdrop-filter: blur(8px);
    }

    .orbis-logo {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        border: 2px solid var(--accent);
        box-shadow: 0 0 25px var(--accent-glow);
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text);
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1.5px;
        margin-bottom: 24px;
    }

    #state {
        color: var(--text);
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
    }

    .sub-status {
        color: var(--accent);
        font-size: 14px;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
    }

    .wait-msg {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 24px;
        font-style: italic;
    }

    .btn-group {
        display: flex;
        gap: 12px;
        margin-top: 4px;
    }

    .btn {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
    }

    .btn:hover {
        background: rgba(56, 189, 248, 0.1);
        border-color: var(--accent);
        color: var(--text);
    }

    #out {
        display: none;
        background: #070a12;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
        font-family: Consolas, monospace;
        font-size: 11px;
        text-align: left;
        width: 100%;
        height: 180px;
        overflow-y: auto;
        padding: 12px;
        margin-top: 20px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>
    <div class="app">
        <div class="top-bar">
            <div class="badge-left">DRAGON-NEXUS-ORBIS</div>
            <div class="badge-right">FW 13.00 - 13.52 // SLOPKIT</div>
        </div>

        <div class="main-container">
            <div class="card">
                <div class="orbis-logo">ORBIS</div>

                <div id="state">Injection du Kernel & GoldHEN</div>
                <div class="sub-status" id="sub-text">Exécution de l'exploit en cours...</div>
                <div class="wait-msg">Veuillez patienter, merci...</div>
                
                <div class="btn-group">
                    <button class="btn" onclick="toggleLogs()">Afficher les logs techniques</button>
                    <a href="index.html" class="btn">Retour au menu</a>
                </div>

                <div id="out"></div>
            </div>
        </div>
    </div>

<script>
    function toggleLogs() {
        var logs = document.getElementById("out");
        logs.style.display = logs.style.display === "block" ? "none" : "block";
    }
</script>
<script type="module" src="./jb.js"></script>
</body>
</html>
