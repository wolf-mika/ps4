<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGON-NEXUS-ORBIS // OFFLINE CACHE</title>
    <link rel="icon" type="image/png" href="../pspulse.png">
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #111827;
            --panel-2: #1e293b;
            --border: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text: #f8fafc;
            --muted: #94a3b8;
            --dim: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); }
        html, body { min-height: 100%; }
        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(30, 41, 59, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.15) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text);
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }
        a { color: inherit; }

        .app { display: flex; flex: 1 0 auto; flex-direction: column; margin: 0 auto; padding: 24px 32px; width: min(100% - 64px, 920px); justify-content: space-between; }

        /* Top status bar */
        .bar {
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            font-size: 13px;
            font-weight: 600;
            justify-content: space-between;
            letter-spacing: 1.5px;
            padding: 10px 16px;
            text-transform: uppercase;
        }
        .bar b { color: var(--accent); font-weight: 600; }
        .bar-fw { color: var(--muted); font-size: 12px; letter-spacing: 1px; }
        .bar-fw::before { color: var(--accent); content: "\25CF "; }

        .layout { display: flex; flex: 1 0 auto; flex-direction: column; justify-content: center; padding: 20px 0; }

        .kicker { color: var(--accent); font-size: 13px; letter-spacing: 1.5px; margin: 0 0 12px; font-family: Consolas, monospace; }
        h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; margin: 0; }
        h1 em { color: var(--accent); font-style: normal; text-shadow: 0 0 20px var(--accent-glow); }
        .sub { color: var(--muted); font-size: 15px; margin: 13px 0 0; }
        .boot { color: var(--dim); font-size: 13px; list-style: none; margin: 16px 0 0; font-family: Consolas, monospace; }
        .boot li { margin: 4px 0; }
        .boot b { color: var(--accent); font-weight: 400; }

        .progress-container { margin-top: 24px; width: 100%; }
        .progress-label { color: var(--accent); font-size: 14px; margin-bottom: 10px; font-weight: 500; }
        .progress-wrapper { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); }
        .progress-bar { background: var(--panel-2); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 6px; height: 48px; overflow: hidden; position: relative; }
        .progress-fill { background: linear-gradient(90deg, #0284c7, var(--accent)); height: 100%; width: 0; transition: width 0.2s ease; }
        .progress-text { color: var(--text); font-size: 16px; font-weight: 600; left: 50%; position: absolute; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); top: 50%; transform: translate(-50%, -50%); z-index: 3; font-family: Consolas, monospace; }
        .status-message { color: var(--muted); font-size: 13px; margin-top: 12px; }

        .foot {
            border-top: 1px solid var(--border);
            color: var(--dim);
            font-size: 12px;
            margin-top: 16px;
            padding: 16px 4px 4px;
            text-align: center;
        }
        .foot a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
        .foot a:hover, .foot a:focus { color: var(--accent); }

        @media (max-width: 700px) {
            body { overflow: auto; }
            .app { padding: 12px 16px; width: min(100% - 32px, 560px); }
            .bar { font-size: 12px; padding: 8px 12px; }
            .layout { padding-top: 14px; }
            h1 { font-size: 32px; }
            .progress-bar { height: 42px; }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="bar">
            <span><b>DRAGON-NEXUS-ORBIS</b> // cache</span>
            <span class="bar-fw">cache update</span>
        </header>

        <main class="layout">
            <p class="kicker">$ ./cache --install</p>
            <h1>Loading <em>offline cache</em></h1>
            <ul class="boot">
                <li>[ <b>ok</b> ] slopkit chain ready</li>
                <li>[ <b>..</b> ] downloading host files</li>
            </ul>

            <section class="progress-container">
                <div class="progress-label" id="progress">Loading.. Please Wait !!!</div>
                <div class="progress-wrapper">
                    <div class="progress-bar" id="myProgress">
                        <div class="progress-fill" id="myBar"></div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
                <div class="status-message">Initializing cache system...</div>
            </section>
        </main>

        <footer class="foot">
            Design: Dragon-Nexus-Orbis // Host Base: PSPulse
        </footer>
    </div>

    <script>
(function () {
    var cache = window.applicationCache;
    var progress = document.getElementById("progress");
    var bar = document.getElementById("myBar");
    var progressText = document.getElementById("progressText");
    var redirected = false;

    function storageSet(value) {
        try { localStorage.setItem("is1352Cached", value ? "true" : "false"); }
        catch (error) {}
    }
    function show(message) {
        if (progress) progress.textContent = message;
    }
    function returnToHost(delay) {
        if (redirected) return;
        redirected = true;
        setTimeout(function () { window.location.replace("index.html"); }, delay);
    }

    if (!cache || !document.documentElement.hasAttribute("manifest")) {
        show("Application cache is unavailable. Returning to host...");
        returnToHost(1500);
        return;
    }

    cache.addEventListener("downloading", function () {
        show("Page caching started...");
        storageSet(false);
    }, false);
    cache.addEventListener("progress", function (event) {
        if (!event || !(event.total > 0)) return;
        var percent = Math.round(100 * event.loaded / event.total);
        if (bar) bar.style.width = percent + "%";
        if (progressText) progressText.textContent = percent + "%";
    }, false);
    cache.addEventListener("cached", function () {
        show("Page cached successfully.");
        storageSet(true);
        returnToHost(750);
    }, false);
    cache.addEventListener("updateready", function () {
        try { cache.swapCache(); } catch (error) {}
        show("Cache updated successfully.");
        storageSet(true);
        returnToHost(750);
    }, false);
    cache.addEventListener("noupdate", function () {
        storageSet(true);
        returnToHost(250);
    }, false);
    cache.addEventListener("error", function () {
        storageSet(false);
        show("Cache failed. Returning to online host...");
        returnToHost(1500);
    }, false);
    cache.addEventListener("obsolete", function () {
        storageSet(false);
        show("Cache is obsolete. Clear browser data and reopen the host.");
    }, false);

    if (cache.status === cache.UPDATEREADY) {
        try { cache.swapCache(); } catch (error) {}
        storageSet(true);
        returnToHost(250);
    } else if (cache.status === cache.IDLE) {
        try { cache.update(); } catch (error) { returnToHost(750); }
    }
}());
    </script>
</body>

</html>
